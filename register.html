<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Member Form</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="page-wrap">
        <header class="card form-header">
            <h1>Library Member Form</h1>
            <p>Submit borrowing and membership requests for library services.</p>
            <nav class="top-nav">
                <a href="Library.html">Home</a>
                <a href="View Books.html">Books</a>
                <a href="index.html">Media & Links</a>
                <a href="register.html" class="active">Member Form</a>
            </nav>
        </header>

        <section class="card form-card">
            <h2>Member Request Details</h2>
            <div class="form-layout">
                <form>
                    <label for="item-name">Book Title</label>
                    <input id="item-name" name="item_name" type="text" required>

                    <label for="requester-name">Requester Name</label>
                    <input id="requester-name" name="requester_name" type="text" required>

                    <fieldset>
                        <legend>Request Type (Radio Buttons)</legend>
                        <label><input type="radio" name="request_type" value="borrow" required> Borrow</label>
                        <label><input type="radio" name="request_type" value="membership"> Membership</label>
                    </fieldset>

                    <fieldset>
                        <legend>Additional Options (Check Boxes)</legend>
                        <label><input type="checkbox" name="options" value="ebook"> Need eBook access</label>
                        <label><input type="checkbox" name="options" value="reminder"> Enable due-date reminders</label>
                    </fieldset>

                    <button type="submit">Submit Form</button>
                </form>
                <aside class="form-image">
                    <img src="as1.jpg" alt="Member desk section in the library">
                </aside>
            </div>
        </section>
    </div>
</body>
</html>

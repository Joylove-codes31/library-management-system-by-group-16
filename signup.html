<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card">
            <h1>Create Member Account</h1>
            <p>Register to borrow books and join community programs.</p>

            <form>
                <label for="fullname">Full Name</label>
                <input id="fullname" name="fullname" type="text" placeholder="Enter your full name" required>

                <label for="dob">Date of Birth</label>
                <input id="dob" name="dob" type="date" required>

                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="Enter email" required>

                <fieldset>
                    <legend>Gender</legend>
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </fieldset>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Create password" required>

                <button type="submit">Create Account</button>
            </form>

            <p class="small">Already a member? <a href="register.html">Sign in</a></p>
            <nav>
                <a href="Library.html">Home</a>
                <a href="View Books.html">Books</a>
                <a href="index.html">Community</a>
            </nav>
        </section>
    </main>
</body>
</html>
